project:
  seed: 42
  device: "0"

yolo:
  base_model: server/models/yolo/yolo26n.pt
  data_yaml: fine-tune/yolo/data.yaml
  epochs: 100
  imgsz: 960
  batch: 12
  workers: 2
  cache: false
  patience: 15
  project: fine-tune/runs/yolo
  name: t4_highres_long
  # Best auto-tune trial (mAP50=0.971, mAP50-95=0.787)
  min_box_area: 0.0005
  val_ratio: 0.15
  lr0: 0.006
  deployed_weights: server/models/yolo/yolo26n_finetuned.pt
  # recall_boost: adaptive hard-case oversample (see train_recall_boost.py)
  recall_boost_max_rounds: 6
  recall_boost_continuous: true
  recall_boost_cam02_factor: 5

reid:
  architecture: resnet18
  image_size: 224
  epochs: 50
  batch: 32
  lr: 0.0003
  margin: 0.3
  embedding_dim: 512
  data_dir: fine-tune/reid/data
  output_dir: fine-tune/runs/reid
  checkpoint: fine-tune/runs/reid/best.pt
  onnx_output: server/app/models/reid_ship_embedding.onnx
